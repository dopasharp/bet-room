<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BET ROOM | 3D Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20252b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px} .pill{background:#1d2632dd;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}#tip{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:13px}#joy{position:absolute;left:22px;bottom:24px;width:110px;height:110px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff20;pointer-events:auto;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#ffffffbb}#buttons{position:absolute;bottom:28px;right:20px;pointer-events:auto}button{background:#f3d58a;color:#282b30;border:0;border-radius:15px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#10151bbd;z-index:5;padding:18px}#panel{max-width:420px;width:100%;background:#29333e;border:1px solid #ffffff33;border-radius:24px;padding:25px;text-align:center;box-shadow:0 18px 60px #0007}input{width:100%;border:1px solid #ffffff44;background:#171f29;color:#fff;border-radius:12px;padding:14px;font-size:16px;margin:12px 0 18px}h1{margin:0 0 8px;letter-spacing:2px}small{color:#c8d0d8;line-height:1.6}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#111c28e8;border-radius:14px;padding:12px 18px;display:none;white-space:nowrap}
</style></head><body><div id="ui"><div id="top"><div class="pill"><b>✉️ BET ROOM</b><div style="font-size:11px;opacity:.8">3D 방 체험판 · 1인 테스트</div></div><div class="pill" id="count">배치 0 / 4</div></div><div id="toast"></div><div id="phase" class="pill" style="position:absolute;top:75px;left:14px;font-size:13px">준비 중</div><div id="tip" class="pill">이동: WASD / 조이스틱 · 시점: 드래그</div><div id="joy"><div id="nub"></div></div><div id="buttons" style="display:flex;gap:8px;align-items:center"><button id="ready" style="display:none;background:#b8ddba">숨기기 완료</button><button id="search" disabled>조사하기</button></div></div><div id="overlay"><div id="panel"><h1>BET ROOM</h1><p>✉️ 숨겨진 봉투를 찾아봐!</p><small>게임 시작 전 내기 내용을 직접 입력해.<br>먼저 봉투 4개를 숨긴 뒤 수색을 시작해.<br>현재는 혼자 플레이하는 로컬 테스트야.</small><input id="bet" value="커피 사기 ☕" maxlength="60" placeholder="내기 항목 입력"><button id="start">방에 들어가기</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a6b7c3');
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7d7e8b,2.2));
const sun=new THREE.DirectionalLight(0xffe4b4,2.4);sun.position.set(-4,9,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const floor=mat('#b7a38c'),wall=mat('#e0ddd4'),wood=mat('#92785e'),cream=mat('#e6ded0'),dark=mat('#444f56'),blue=mat('#63809b'),green=mat('#6c886f');
function box(w,h,d,x,y,z,m,group=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
box(12,.2,11,0,-.1,0,floor);box(12,3,.15,0,1.5,-5.5,wall);box(.15,3,11,-6,1.5,0,wall);
box(3,.45,4,-3.5,.35,-2.8,wood);box(2.8,.3,3.2,-3.5,.72,-2.8,cream);box(2.7,.16,1,-3.5,.95,-4,blue);box(2.4,.12,1.8,-3.5,.14,-2.8,mat('#b9a994'));
box(2.4,.13,1.1,2.8,1.15,-4.65,wood);for(let x of [1.8,3.8])box(.13,1.1,.13,x,.6,-4.65,dark);
box(.9,.55,.07,2.8,1.58,-4.85,dark);box(.7,.06,.3,2.8,1.2,-4.1,dark);box(.7,.65,.7,2.8,.4,-3.45,blue);
box(1.6,2.4,1.2,4.65,1.2,-2.65,wood);box(.03,1.7,.05,4.66,1.2,-1.99,cream);
box(2.5,.65,.9,3.8,.34,2.8,dark);box(2.4,.4,.85,3.8,.83,2.8,blue);box(2,.08,1.2,1.5,.12,2.4,cream);
box(1.2,1.6,.8,-4.8,.8,2.7,wood);for(let y of [.4,.85,1.3])box(1.1,.06,.85,-4.8,y,2.7,cream);
box(.8,.65,.8,-1.2,.32,3.7,green);box(.7,.12,.7,-1.2,.7,3.7,mat('#c3a888'));
const player=new THREE.Group();scene.add(player);
box(.55,.8,.36,0,.95,0,blue,player);box(.4,.42,.4,0,1.58,0,cream,player);box(.2,.42,.26,-.16,.35,0,dark,player);box(.2,.42,.26,.16,.35,0,dark,player);box(.65,.12,.48,0,1.85,0,dark,player);
player.position.set(0,0,0);
const spots=[['침대',-3.5,-2.7],['책상',2.8,-4.3],['옷장',4.65,-2.4],['소파',3.8,2.8],['책장',-4.8,2.7],['화분',-1.2,3.7],['러그',1.5,2.4],['베개',-3.5,-4]];
const markers=[];for(const [name,x,z] of spots){const ring=new THREE.Mesh(new THREE.RingGeometry(.36,.45,32),new THREE.MeshBasicMaterial({color:'#ffd46b',side:THREE.DoubleSide,transparent:true,opacity:.65}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.015,z);scene.add(ring);markers.push(ring)}
let bet='커피 사기 ☕',active=false,phase='hide',freeze=0,opened=new Set(),loot=[],yaw=0,joystick={x:0,y:0},keys={},drag=false,lastX=0,near=-1,noticeUntil=0;
const $=id=>document.getElementById(id);
function notice(s){$('toast').textContent=s;$('toast').style.display='block';noticeUntil=performance.now()+2100}
$('start').onclick=()=>{bet=$('bet').value.trim()||'커피 사기';$('overlay').style.display='none';active=true;phase='hide';loot=[];$('phase').textContent='✉️ 숨기기 단계 · 봉투를 4곳에 배치';notice('가구에 다가가 봉투를 숨겨봐!');};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();search()}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=$('joy');function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),n=Math.min(1,len/40);joystick={x:dx/len*n,y:dy/len*n};$('nub').style.transform='translate('+joystick.x*32+'px,'+joystick.y*32+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))joyMove(e)});for(const type of ['pointerup','pointercancel'])joy.addEventListener(type,()=>{joystick={x:0,y:0};$('nub').style.transform=''});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.007;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);
function search(){
if(!active||freeze>0||near<0)return;
if(phase==='hide'){
 if(loot.includes(near))return;
 loot.push(near);
 const name=loot.length===1?'내기 봉투':'꽝 봉투';
 notice('✉️ '+spots[near][0]+'에 '+name+' 숨김');
 $('count').textContent='배치 '+loot.length+' / 4';
 if(loot.length===4){$('ready').style.display='block';$('phase').textContent='배치 완료 · 수색 시작 버튼을 눌러줘'}
 return;
}
if(opened.has(near))return;
opened.add(near);
let n=loot.indexOf(near);
if(n===0){notice('✉️ 내기 봉투 발견! '+bet);$('phase').textContent='🎉 내기 봉투 발견 · 게임 종료';active=false;setTimeout(()=>alert('🎉 내기 봉투 발견!\\n'+bet+'\\n\\n이 버전은 1인 규칙 테스트입니다.'),250)}
else if(n>0){freeze=5;notice('💥 꽝! 5초 정지')}
else notice('텅 비었어!');
$('count').textContent='조사 '+opened.size+' / 8';
}
$('ready').onclick=()=>{if(loot.length!==4)return;phase='search';opened.clear();$('ready').style.display='none';$('phase').textContent='🔎 수색 단계 · 봉투를 찾아봐';$('count').textContent='조사 0 / 8';notice('수색 시작! 꽝은 5초 정지');};
$('search').onclick=search;
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;if(active){freeze=Math.max(0,freeze-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joystick.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joystick.y,len=Math.hypot(x,z);if(len>.05&&freeze<=0){x/=Math.max(1,len);z/=Math.max(1,len);const xx=(x*Math.cos(yaw)-z*Math.sin(yaw))*dt*3,zz=(x*Math.sin(yaw)+z*Math.cos(yaw))*dt*3;player.position.x=THREE.MathUtils.clamp(player.position.x+xx,-5.3,5.3);player.position.z=THREE.MathUtils.clamp(player.position.z+zz,-4.8,4.8);player.rotation.y=Math.atan2(xx,zz)}near=-1;let distance=1.65;spots.forEach(([n,x,z],i)=>{let d=Math.hypot(player.position.x-x,player.position.z-z);markers[i].material.opacity=d<1.65?.95:.28;if(d<distance&&!(phase==='search'&&opened.has(i))){distance=d;near=i}});$('search').disabled=near<0||freeze>0||(phase==='hide'&&(loot.includes(near)||loot.length>=4));$('search').textContent=freeze>0?'❄️ '+Math.ceil(freeze)+'초 정지':near>=0?(phase==='hide'?(loot.includes(near)?'이미 배치함':spots[near][0]+'에 숨기기'):spots[near][0]+' 조사하기'):'가구에 접근';$('tip').textContent=freeze>0?'꽝! 잠시 움직일 수 없어':near>=0?spots[near][0]+' 근처 · '+(phase==='hide'?'봉투 숨기기':'조사하기'):'이동: WASD / 조이스틱 · 시점: 드래그';if(now>noticeUntil)$('toast').style.display='none'}
const target=new THREE.Vector3(player.position.x-Math.sin(yaw)*4.7,3.6,player.position.z+Math.cos(yaw)*4.7);camera.position.lerp(target,.1);camera.lookAt(player.position.x,1.05,player.position.z);renderer.render(scene,camera)}
requestAnimationFrame(loop);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
